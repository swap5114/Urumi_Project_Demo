
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb
            - name: WORDPRESS_DB_NAME
              value: store
            - name: WORDPRESS_DB_USER
              value: storeuser
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password

          # startup: the image copies WordPress files into the volume on first boot.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36     # up to 180 s
          # readiness: wp-login.php needs the database, so the pod only gets traffic once WordPress can really answer.
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # liveness: only "is Apache alive". It must NOT depend on the database,
          # otherwise a MariaDB outage would restart WordPress pods for no reason.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources.wordpress | nindent 12 }}

          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data
