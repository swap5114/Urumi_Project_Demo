# Only the MCP endpoint and the admin API are public. /healthz and /readyz are for the kubelet and are NOT routed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
