{{- range .Values.servers }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-{{ .name }}
  labels:
    app: mcp-{{ .name }}
spec:
  type: ClusterIP            # reachable only inside the cluster
  selector:
    app: mcp-{{ .name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
