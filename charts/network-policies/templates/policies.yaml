# 1. Deny everything. Every rule below ADDS one allowed connection. A pod nobody mentioned can talk to nobody.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. Every pod may ask DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.dns.podLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
# ---------------- Store: MariaDB <- WordPress <- Ingress ----------------
# MariaDB accepts connections only from WordPress and from the one-off setup Job. It starts none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
spec:
  podSelector:
    matchLabels: { app: mariadb }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wordpress } }
        - podSelector: { matchLabels: { app: wp-setup } }
      ports:
        - { port: 3306, protocol: TCP }
---
# WordPress: users arrive through the Ingress controller; the WooCommerce MCP server calls its REST API.
# It talks to MariaDB and to the internet (updates, plugins).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress
spec:
  podSelector:
    matchLabels: { app: wordpress }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "np.fromIngressController" . | nindent 8 }}
        - podSelector: { matchLabels: { app: woocommerce-mcp } }
      ports:
        - { port: 80, protocol: TCP }
  egress:
    - to:
        - podSelector: { matchLabels: { app: mariadb } }
      ports:
        - { port: 3306, protocol: TCP }
    {{- include "np.toInternet" . | nindent 4 }}
---
# The setup Job (WP-CLI): database and the internet (it downloads WooCommerce). Nothing may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wp-setup
spec:
  podSelector:
    matchLabels: { app: wp-setup }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: mariadb } }
      ports:
        - { port: 3306, protocol: TCP }
    {{- include "np.toInternet" . | nindent 4 }}
---
# ---------------- MCP upstream servers: ONLY the gateway may call them ----------------
# WooCommerce MCP server: called by the gateway, calls WordPress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woocommerce-mcp
spec:
  podSelector:
    matchLabels: { app: woocommerce-mcp }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - { port: 3000, protocol: TCP }
  egress:
    - to:
        - podSelector: { matchLabels: { app: wordpress } }
      ports:
        - { port: 80, protocol: TCP }
---
# The demo upstreams (fx, notes): called by the gateway, they call nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-mcp-servers
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [mcp-fx, mcp-notes] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports:
        - { port: 3000, protocol: TCP }
---
# ---------------- Gateway and dashboard ----------------
# Gateway: users arrive through the Ingress controller. It calls the three upstreams and the internet
# (the LLM API, and any external MCP server an admin registers). It cannot reach the database or WordPress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "np.fromIngressController" . | nindent 8 }}
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [woocommerce-mcp, mcp-fx, mcp-notes] }
      ports:
        - { port: 3000, protocol: TCP }
    {{- include "np.toInternet" . | nindent 4 }}
---
# Dashboard: static files served to users arriving through the Ingress controller. It calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
spec:
  podSelector:
    matchLabels: { app: dashboard }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "np.fromIngressController" . | nindent 8 }}
      ports:
        - { port: 8080, protocol: TCP }
