apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  labels:
    app: woocommerce-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woocommerce-mcp
  template:
    metadata:
      labels:
        app: woocommerce-mcp
    spec:
      containers:
        - name: woocommerce-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: WC_BASE_URL
              value: {{ .Values.woocommerce.baseUrl | quote }}
            - name: WC_SIGN_BASE_URL
              value: {{ .Values.woocommerce.siteUrl | quote }}
            - name: WC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerce.secretName | quote }}
                  key: consumer-key
            - name: WC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerce.secretName | quote }}
                  key: consumer-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false