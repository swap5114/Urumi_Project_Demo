# Included in every location: nginx does NOT inherit add_header into a location that has its own add_header,
# so the headers are repeated through this one file.
#
# CSP: the app loads only its own script and stylesheet and talks only to its own origin (/api, /mcp), so
# everything else is refused. Even if some injected text ever reached the page, it could not run a script
# or send the API key to another site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
