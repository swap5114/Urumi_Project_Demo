server {
    listen 8080;
    server_name _;
    server_tokens off;            # do not announce the nginx version
    root /usr/share/nginx/html;
    index index.html;

    # Probe endpoint for the kubelet. It says nothing about the system.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # Build output has a content hash in its name, so it can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Single-page app: any other path (for example /chat) is served by index.html and handled in the browser.
    # index.html must never be cached, otherwise a new release would not be picked up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
